name: Host-Ship Auto Renew

on:
  workflow_dispatch:

  schedule:
    # 每 5 天北京时间 08:00 自动检查（每月 1/6/11/16/21/26/31 日）
    # GitHub cron 使用 UTC
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 */5 * *"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests "requests[socks]"
          python -m playwright install --with-deps chromium

      - name: Setup optional VLESS/VMess/Trojan node
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            echo "NODE_LINK detected, setting up local proxy..."

            # 注意：上游脚本自带 set -e，裸 TCP 配置导致 sing-box 启动失败时
            # 上游脚本会直接 exit 1（就是你这次日志里的报错），后面的本地修复
            # 根本没机会执行。此处加 || true，保证修复逻辑一定能跑到。
            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh) || echo "[WARN] 上游脚本异常退出，继续应用本地修复..."

            # Fix 1: 上游脚本对裸 TCP 链接(无 type= 参数)会生成
            # "transport":{"type":"tcp",...}，但 sing-box 没有 tcp/raw
            # 这种 transport 类型，裸 TCP 必须省略 transport 字段。
            # 已用 sing-box v1.14.1 check 验证：省略=OK，tcp/raw=FAIL，
            # ws/http/grpc/quic/httpupgrade 保留原样。
            # Fix 2: 上游 trojan 解析只认 sni=，不认旧版 peer= 参数。
            # 形如 trojan://pass@host:port?peer=SNI 的链接 server_name
            # 会回退成 IP，导致自签证书校验失败(x509 IP SANs)。
            # 此处若 server_name 是 IP 且 NODE_LINK 含 peer=，则用
            # peer 值覆盖 tls.server_name，并置 insecure=true
            # （openssl 实测：该节点证书 subject=issuer=CN mozilla.org，
            # 自签名，hpkp 与证书指纹一致，必须跳过系统 CA 校验）。
            # 已本地实测拨号验证 OK（curl 经 socks 返回出口 IP）。
            if [ -f sing-box-config.json ]; then
              # hy2 链接参数 -> sing-box 字段映射（已用 sing-box 实测 check 验证）：
              # peer=/sni=  -> tls.server_name（上游只认 sni=，peer= 会丢成 IP，必须回填；
              #               自签证书 CN=mozilla.org，SNI 不对连握手都建不起来）
              # obfs=none   -> 删 obfs 对象（上游把字符串 "none" 当 salamander 密码，
              #               服务端没开混淆就对不上，直接超时）
              # hpkp=...    -> sing-box 无指纹 pin 字段，忽略；自签证书本就靠
              #               insecure=true 跳过系统 CA 校验（见下）
              PEER_HOST="$(echo "$NODE_LINK" | grep -o 'peer=[^&]*' | cut -d= -f2 | head -1)"
              [ -z "$PEER_HOST" ] && PEER_HOST="$(echo "$NODE_LINK" | grep -o 'sni=[^&]*' | cut -d= -f2 | head -1)"
              HAS_HPKP="$(echo "$NODE_LINK" | grep -c 'hpkp=[^&]*')"
              jq --arg peer "$PEER_HOST" --argjson hpkp "$HAS_HPKP" '
                (.outbounds[]
                  | select(.transport?.type == "tcp" or .transport?.type == "raw")
                  | .transport) = null
                | (.outbounds[]
                  | select($peer != "" and (.tls.server_name | test("^[0-9.]+$")))
                  | .tls.server_name) = $peer
                | (.outbounds[]
                  | select(.type == "hysteria2" and (.obfs.password? // "") == "none")
                  | .obfs) = null
                | (.outbounds[]
                  | select(.type == "hysteria2"
                    and ($hpkp > 0 or $peer != "")
                    and (.tls.insecure == false))
                  | .tls.insecure) = true
                | del(.. | select(. == null))
              ' \
                sing-box-config.json > sing-box-config.fixed.json \
                && mv sing-box-config.fixed.json sing-box-config.json \
                && echo "[INFO] 已应用配置修复(peer=${PEER_HOST:-无})" \
                && ./sing-box check -c sing-box-config.json

              if ! pgrep -f "sing-box run" > /dev/null; then
                echo "[INFO] sing-box 未在运行，重新启动..."
                ./sing-box run -c sing-box-config.json > sing-box.log 2>&1 &
                sleep 5
                if ! pgrep -f "sing-box run" > /dev/null; then
                  echo "[ERROR] sing-box 进程启动失败，查看日志:"
                  cat sing-box.log
                  exit 1
                fi
              fi

              echo "[INFO] 测试代理连接..."
              PROXY_OK=false
              for i in 1 2 3; do
                if curl -x socks5://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
                  echo "[INFO] ✅ 代理连接成功"
                  echo "IS_PROXY=true" >> "$GITHUB_ENV"
                  echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
                  PROXY_OK=true
                  break
                fi
                echo "[WARN] 尝试 $i/3..."
                sleep 3
              done
              if [ "$PROXY_OK" != "true" ]; then
                echo "[WARN] ❌ 代理连接失败（context deadline = 节点在 Actions 出口不可达），回退直连"
                echo "---- sing-box 日志 ----"
                cat sing-box.log || true
                pkill -f sing-box || true
                echo "IS_PROXY=false" >> "$GITHUB_ENV"
              fi
            fi

          else
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            echo "No NODE_LINK, direct connection will be used."
          fi

      - name: Run renew
        env:
          HOSTSHIP_LOGIN: ${{ secrets.HOSTSHIP_LOGIN }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          SEND_SHOTS: ${{ secrets.SEND_SHOTS }}

          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}

        run: python hostship_renew.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-debug-screenshots
          path: |
            hostship_*.png
          if-no-files-found: ignore

      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log || true
