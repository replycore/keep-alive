name: Host-Ship Auto Renew

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 08:00 自动检查
    # GitHub cron 使用 UTC
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests "requests[socks]"
          python -m playwright install --with-deps chromium

      - name: Setup optional VLESS/VMess/Trojan node
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            echo "NODE_LINK detected, setting up local proxy..."

            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

            # Fix: 上游脚本对裸 TCP 链接(无 type= 参数)会生成
            # "transport":{"type":"tcp",...}，但 sing-box 没有 tcp/raw
            # 这种 transport 类型，裸 TCP 必须省略 transport 字段。
            # 已用 sing-box v1.14.1 check 验证：省略=OK，tcp/raw=FAIL，
            # ws/http/grpc/quic/httpupgrade 保留原样。
            if [ -f sing-box-config.json ]; then
              jq '(.outbounds[] | select(.transport?.type == "tcp" or .transport?.type == "raw") | .transport) |= null | del(.. | select(. == null))' \
                sing-box-config.json > sing-box-config.fixed.json \
                && mv sing-box-config.fixed.json sing-box-config.json \
                && echo "[INFO] 已移除裸 TCP transport 字段" \
                && ./sing-box check -c sing-box-config.json

              if ! pgrep -f "sing-box run" > /dev/null; then
                echo "[INFO] sing-box 未在运行，重新启动..."
                ./sing-box run -c sing-box-config.json > sing-box.log 2>&1 &
                sleep 5
                if ! pgrep -f "sing-box run" > /dev/null; then
                  echo "[ERROR] sing-box 进程启动失败，查看日志:"
                  cat sing-box.log
                  exit 1
                fi
              fi

              echo "[INFO] 测试代理连接..."
              for i in 1 2 3; do
                if curl -x socks5://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
                  echo "[INFO] ✅ 代理连接成功"
                  echo "IS_PROXY=true" >> "$GITHUB_ENV"
                  echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
                  break
                fi
                echo "[WARN] 尝试 $i/3..."
                sleep 3
                if [ "$i" = "3" ]; then
                  echo "[ERROR] ❌ 代理连接失败"
                  echo "---- sing-box 日志 ----"
                  cat sing-box.log
                  exit 1
                fi
              done
            fi

          else
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            echo "No NODE_LINK, direct connection will be used."
          fi

      - name: Run renew
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          HOSTSHIP_LOGIN: ${{ secrets.HOSTSHIP_LOGIN }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}

        run: python hostship_renew.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-debug-screenshots
          path: |
            hostship_*.png
          if-no-files-found: ignore

      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log || true
