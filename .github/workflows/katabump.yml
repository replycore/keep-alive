name: KataBump Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 09:00 / 21:00 各检查一次
    # GitHub cron 用 UTC：01:00 / 13:00 UTC = 09:00 / 21:00 CST
    - cron: "0 1,13 * * *"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run renew
        env:
          KATA_SERVER_ID: ${{ secrets.KATA_SERVER_ID }}
          KATA_EMAIL: ${{ secrets.KATA_EMAIL }}
          KATA_PASSWORD: ${{ secrets.KATA_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python katabump_renew.py
